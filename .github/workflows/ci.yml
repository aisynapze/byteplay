name: BytePlay quality checks
on:
  push:
    branches: ["implement/byteplay-v0.1.1"]
    paths:
      - "*.go"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Go, security tests, and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - name: Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Diagnose Go formatting
        run: |
          gofmt -d *.go
      - name: Compile
        run: go build ./...
      - name: Verify downloaded Go modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: JavaScript syntax
        run: |
          node --check client/assets/index.js
          node --check client/assets/player-timeline.js
          node --check client/assets/byteplay-app.js
          node --check client/assets/byteplay-core.mjs
      - name: Frontend rules and timeline tests
        run: node --test client/assets/player-timeline.test.mjs client/assets/byteplay-core.test.mjs
      - name: CSS build
        run: |
          npm ci
          npm run build
      - name: Go formatting gate
        run: |
          test -z "$(gofmt -l *.go)"
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: FFmpeg availability
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders | grep -E '[[:space:]]libx264[[:space:]]'
          ffmpeg -hide_banner -encoders | grep -E '[[:space:]]aac[[:space:]]'
          ffprobe -version

  media-source:
    name: Local seed and FFmpeg codec route fixtures (20/100 Mbps)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Generate 60-second synthetic H264/AAC media and sparse padding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p "$RUNNER_TEMP/byteplay-seed"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=640x360:rate=24' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 60 -c:v libx264 -preset ultrafast -crf 32 \
            -pix_fmt yuv420p -c:a aac -b:a 96k \
            -movflags +faststart "$RUNNER_TEMP/byteplay-seed/clip.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/byteplay-seed/clip.mp4" \
            -t 18 -c:v copy -c:a ac3 -b:a 192k "$RUNNER_TEMP/byteplay-seed/audio-ac3.mkv"
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/byteplay-seed/clip.mp4" \
            -t 18 -c:v mpeg4 -q:v 5 -c:a copy "$RUNNER_TEMP/byteplay-seed/video-mpeg4.mkv"
          truncate -s 230686720 "$RUNNER_TEMP/byteplay-seed/padding.bin"
          test -s "$RUNNER_TEMP/byteplay-seed/clip.mp4"
      - name: Range and partial-download integration, loopback peers only
        env:
          BYTEPLAY_TEST_FIXTURE_ROOT: ${{ runner.temp }}/byteplay-seed
        run: |
          go test -tags=integration -run "Test(SeededMediaSourceRangeBeforeFullDownload|HLSFFmpegRouteFixtureMatrix|TorrentBackedHLSReadyBeforeWholeTorrentCompletion)" -count=1 -timeout=120s -v .
          go test -race -tags=integration -run "Test(SeededMediaSourceRangeBeforeFullDownload|HLSFFmpegRouteFixtureMatrix|TorrentBackedHLSReadyBeforeWholeTorrentCompletion)" -count=1 -timeout=120s -v .
