name: BytePlay quality checks
on:
  push:
    branches: ["implement/byteplay-v0.1.1"]
    paths:
      - "*.go"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Go, security tests, and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - name: Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Diagnose Go formatting
        run: |
          gofmt -d security.go main_test.go main.go
      - name: Compile
        run: go build ./...
      - name: Verify downloaded Go modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: JavaScript syntax
        run: node --check client/assets/index.js
      - name: CSS build
        run: |
          npm ci
          npm run build
      - name: Go formatting gate
        run: |
          test -z "$(gofmt -l security.go main_test.go main.go)"
      - name: FFmpeg availability
        run: |
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -encoders | grep -E '[[:space:]]aac[[:space:]]'
          ffprobe -version
